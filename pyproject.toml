[project]
name = "n3fjp-mcp"
version = "0.3.3"
description = "An MCP server that lets Claude and other AI assistants log amateur-radio QSOs to N3FJP logging software over its TCP API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Stefan Brunner (AE5VG)", email = "me@stefanbrunner.org" },
]
keywords = [
    "n3fjp",
    "mcp",
    "model-context-protocol",
    "ham-radio",
    "amateur-radio",
    "contest",
    "logging",
    "field-day",
    "qso",
    "claude",
    "ai-assistant",
    "ai-agent",
    "llm",
    "ae5vg",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications :: Ham Radio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp[cli]>=1.2.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
n3fjp-mcp = "n3fjp_mcp.server:main"

[project.urls]
Homepage = "https://ae5vg.com/products/n3fjp-mcp.html"
Documentation = "https://github.com/sbrunner-atx/n3fjp-mcp#readme"
Repository = "https://github.com/sbrunner-atx/n3fjp-mcp"
Issues = "https://github.com/sbrunner-atx/n3fjp-mcp/issues"
Changelog = "https://github.com/sbrunner-atx/n3fjp-mcp/blob/main/CHANGELOG.md"
"Field Guide" = "https://github.com/sbrunner-atx/n3fjp-mcp/blob/main/docs/operating-skills-field-guide.pdf"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/n3fjp_mcp"]

# Ruff is a fast linter/formatter; configuring it here is a sign of a maintained
# project. We run it in CI.
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["livecheck.py", "make_icon.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
